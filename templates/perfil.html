<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; padding: 20px 10px; }
        .app-container { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; position: relative; }

        /* Avatar de Perfil Principal */
        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #d8c5ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-size: 70px;
        }

        /* Tarjeta de Información */
        .info-card {
            width: 100%;
            background-color: #f3edf7;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .avatar-initial {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #e6dded;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #49454f;
        }

        .user-text h3 { font-size: 15px; color: #1d1b20; font-weight: 600; }
        .user-text p { font-size: 13px; color: #49454f; }

        /* Calendario Widget */
        .calendar-card {
            width: 100%;
            background-color: #f3edf7;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .calendar-header {
            font-size: 12px;
            color: #49454f;
            margin-bottom: 8px;
        }

        .calendar-selected-date {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: 500;
            color: #1d1b20;
            margin-bottom: 16px;
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #1d1b20;
            margin-bottom: 12px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            gap: 8px 0;
            color: #1d1b20;
        }

        .day-header { font-weight: 600; color: #49454f; padding-bottom: 6px; }
        .day-number { padding: 6px 0; cursor: pointer; }
        .day-number.selected {
            background-color: #e8def8;
            border: 1px solid #65558f;
            border-radius: 50%;
            font-weight: 600;
        }

        /* Control de Notificaciones */
        .setting-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 8px;
        }

        .setting-text h4 { font-size: 14px; color: #1d1b20; font-weight: 500; }
        .setting-text p { font-size: 12px; color: #49454f; }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 24px;
        }

        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }

        input:checked + .slider { background-color: #65558f; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Floating Actions Bar */
        .floating-actions {
            background-color: #ffb4a2;
            border-radius: 28px;
            padding: 12px 24px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #202124; }

        /* Tarjeta Flotante de Examen */
        .toast-card {
            position: absolute;
            top: 210px;
            right: -20px;
            width: 220px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            z-index: 50;
        }

        .toast-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .toast-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #1d1b20; }
        .toast-close { background: none; border: none; font-size: 14px; cursor: pointer; color: #49454f; }
        .toast-body { font-size: 12px; color: #49454f; margin-bottom: 12px; }
        .btn-toast { background-color: #2e2e2e; color: #ffffff; border: none; border-radius: 10px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Avatar Central -->
        <div class="profile-avatar">👤</div>

        <!-- Tarjeta Nombre/Puesto -->
        <div class="info-card">
            <div class="avatar-initial">A</div>
            <div class="user-text">
                <h3>"Nombre"</h3>
                <p>"Puesto"</p>
            </div>
        </div>

        <!-- Aviso Examen Pendiente -->
        <div class="toast-card" id="toastExam">
            <div class="toast-header">
                <span class="toast-title">ⓘ Examen</span>
                <button class="toast-close" onclick="document.getElementById('toastExam').style.display='none'">✕</button>
            </div>
            <p class="toast-body">Tienes un examen pendiente</p>
            <button class="btn-toast">Contestar</button>
        </div>

        <!-- Widget Calendario -->
        <div class="calendar-card">
            <div class="calendar-header">Select date</div>
            <div class="calendar-selected-date">
                <span>Mon, Aug 17</span>
                <span style="font-size:18px;">✏️</span>
            </div>
            <div class="month-selector">
                <span>August 2025 ▾</span>
                <div><span>‹</span> &nbsp; <span>›</span></div>
            </div>
            <div class="days-grid">
                <div class="day-header">S</div><div class="day-header">M</div><div class="day-header">T</div><div class="day-header">W</div><div class="day-header">T</div><div class="day-header">F</div><div class="day-header">S</div>
                <div></div><div></div><div></div><div></div><div></div><div></div><div class="day-number">1</div>
                <div class="day-number">2</div><div class="day-number">3</div><div class="day-number">4</div><div class="day-number selected">5</div><div class="day-number">6</div><div class="day-number">7</div><div class="day-number">8</div>
            </div>
        </div>

        <!-- Switch Notificación -->
        <div class="setting-row">
            <div class="setting-text">
                <h4>Notificación</h4>
                <p>Activa</p>
            </div>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Acciones Inferiores -->
        <div class="floating-actions">
            <button class="action-btn">🔗</button>
            <button class="action-btn">💬</button>
            <button class="action-btn">📥</button>
        </div>
    </div>

</body>
</html>
