<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carl's Jr. - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 10px;
        }

        .title {
            font-size: 38px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .form-card {
            width: 100%;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            color: #333;
        }

        .input-group input::placeholder {
            color: #b3b3b3;
        }

        .input-group input:focus {
            border-color: #e31837;
        }

        .submit-btn {
            width: 100%;
            background-color: #e31837;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #c4122c;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo de la estrella -->
        <img src="{{ url_for('static', filename='images/star.png') }}" alt="Carl's Jr. Logo" class="logo">
        
        <!-- Nombre de la marca -->
        <h1 class="title">Carl´s Jr</h1>

        <!-- Tarjeta del Formulario -->
        <div class="form-card">
            <form action="/guardar" method="POST">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="nombre" placeholder="Value" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Value" required>
                </div>

                <button type="submit" class="submit-btn">Iniciar sesión</button>
            </form>
        </div>
    </div>

</body>
</html>
